<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jarvis — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #090a0f;
      --sidebar: rgba(16, 19, 26, 0.65);
      --surface: rgba(22, 26, 35, 0.55);
      --surface2: rgba(30, 35, 45, 0.7);
      --border: rgba(255, 255, 255, 0.06);
      --border-light: rgba(255, 255, 255, 0.12);
      --primary: #6c63ff;
      --primary-dim: rgba(108, 99, 255, 0.15);
      --primary-glow: rgba(108, 99, 255, 0.35);
      --accent: #00d2ff;
      --accent-glow: rgba(0, 210, 255, 0.35);
      --green: #10b981;
      --red: #f43f5e;
      --text: #f8fafc;
      --muted: #94a3b8;
      --muted2: #475569;
      --glass-blur: blur(16px);
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }
    body, html { height: 100%; font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }
    
    /* Global Glassmorphism Background Pattern */
    body::before {
      content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
      background: radial-gradient(circle at 50% 50%, rgba(108,99,255,0.05) 0%, transparent 50%),
                  radial-gradient(circle at 80% 20%, rgba(0,210,255,0.05) 0%, transparent 40%);
      z-index: -1; pointer-events: none;
    }

    .app { display: flex; height: 100vh; position: relative; z-index: 1; }

    /* ── Sidebar ── */
    .sidebar {
      width: 280px; flex-shrink: 0; background: var(--sidebar);
      backdrop-filter: var(--glass-blur); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .sidebar-header { padding: 24px 20px 20px; display: flex; align-items: center; gap: 14px; }
    .logo-icon {
      width: 42px; height: 42px; border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; font-weight: 800; color: #fff; flex-shrink: 0;
      box-shadow: 0 0 20px var(--primary-glow);
    }
    .logo-text { font-size: 1.2rem; font-weight: 700; letter-spacing: 0.5px; }
    .logo-sub { font-size: 0.75rem; color: var(--accent); margin-top: 2px; font-weight: 500; }

    .nav-menu { padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
    .nav-item {
      padding: 12px 16px; background: transparent; border: 1px solid transparent;
      border-radius: 10px; color: var(--muted); font-family: inherit; font-size: 0.95rem; font-weight: 500;
      cursor: pointer; display: flex; align-items: center; gap: 12px; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      text-align: left;
    }
    .nav-item:hover { background: var(--surface2); color: var(--text); transform: translateX(4px); }
    .nav-item.active { background: var(--primary-dim); color: #fff; border-color: rgba(108,99,255,0.3); box-shadow: 0 4px 12px var(--primary-dim); }

    .conv-section { flex: 1; display: flex; flex-direction: column; overflow: hidden; margin-top: 10px; }
    .sidebar-label { padding: 0 20px 8px; font-size: 0.7rem; font-weight: 700; color: var(--muted2); text-transform: uppercase; letter-spacing: 0.1em; }
    .conv-list { flex: 1; overflow-y: auto; padding: 0 12px; }
    .conv-item {
      padding: 10px 14px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; color: var(--muted);
      transition: all 0.2s; display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 2px;
    }
    .conv-item:hover { background: var(--surface2); color: var(--text); }
    .conv-item.active { color: var(--accent); font-weight: 600; }
    .conv-title-wrap { display: flex; align-items: center; gap: 10px; flex: 1; overflow: hidden; }
    .conv-title-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
    .conv-actions { display: none; align-items: center; gap: 4px; flex-shrink: 0; }
    .conv-item:hover .conv-actions, .conv-item.active .conv-actions { display: flex; }
    .conv-action-btn { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 0.78rem; padding: 2px 4px; border-radius: 4px; transition: all 0.15s; }
    .conv-action-btn:hover { color: var(--text); background: rgba(255,255,255,0.12); }
    .conv-action-btn.delete:hover { color: var(--red); background: rgba(255,92,124,0.15); }

    .sidebar-footer { border-top: 1px solid var(--border); padding: 16px 20px; }
    .user-info { display: flex; align-items: center; gap: 12px; overflow: hidden; }
    .avatar {
      width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      display: flex; align-items: center; justify-content: center; font-weight: 700; color: #fff;
    }
    .user-details { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .user-name { font-size: 0.9rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .user-email { font-size: 0.72rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .logout-btn {
      margin-left: auto; background: rgba(244, 63, 94, 0.1); border: 1px solid rgba(244, 63, 94, 0.2); color: var(--red); cursor: pointer;
      font-size: 0.75rem; padding: 6px 10px; border-radius: 6px; transition: all 0.2s; font-weight: 600; white-space: nowrap; flex-shrink: 0;
    }
    .logout-btn:hover { background: rgba(244, 63, 94, 0.25); border-color: var(--red); }

    /* ── Main Area ── */
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: transparent; }
    .topbar {
      padding: 16px 30px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 16px; background: rgba(16, 19, 26, 0.4);
      backdrop-filter: var(--glass-blur); z-index: 10;
    }
    .topbar-title { font-size: 1.1rem; font-weight: 600; letter-spacing: 0.5px; }
    .topbar-sub { font-size: 0.8rem; color: var(--muted); }
    .topbar-actions { margin-left: auto; display: flex; gap: 12px; }

    .view-container { display: none; flex: 1; flex-direction: column; overflow: hidden; }
    .view-container.active { display: flex; animation: fadeInView 0.4s ease forwards; }
    @keyframes fadeInView { from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }

    .content-area { flex: 1; overflow-y: auto; padding: 30px; }
    .content-area::-webkit-scrollbar { width: 6px; }
    .content-area::-webkit-scrollbar-thumb { background: var(--muted2); border-radius: 99px; }

    /* Button styles */
    .btn {
      padding: 10px 18px; border-radius: 8px; font-family: inherit; font-size: 0.9rem;
      font-weight: 600; cursor: pointer; transition: all 0.2s; border: none;
      display: flex; align-items: center; gap: 8px; justify-content: center;
    }
    .btn-primary { background: linear-gradient(135deg, var(--primary), #857dff); color: #fff; box-shadow: 0 4px 15px var(--primary-glow); }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px var(--primary-glow); }
    .btn-outline { background: transparent; border: 1px solid var(--border-light); color: var(--text); }
    .btn-outline:hover { background: var(--surface2); border-color: var(--muted); }
    .btn-danger { background: rgba(244, 63, 94, 0.1); color: var(--red); border: 1px solid rgba(244, 63, 94, 0.3); }
    .btn-danger:hover { background: rgba(244, 63, 94, 0.2); }
    /* Mic button & Voice Animations */
    .mic-btn {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--surface2);
      border: 1px solid var(--border-light);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      color: var(--text);
      margin-right: 4px;
      flex-shrink: 0;
      font-size: 1.1rem;
    }
    .mic-btn:hover { background: var(--primary-dim); border-color: var(--primary); color: var(--primary); transform: scale(1.05); }
    .mic-btn.listening {
      background: #f43f5e !important;
      color: #ffffff !important;
      border-color: #f43f5e !important;
      animation: micPulse 1.5s infinite;
    }
    @keyframes micPulse {
      0% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0.7); transform: scale(1); }
      50% { box-shadow: 0 0 0 10px rgba(244, 63, 94, 0); transform: scale(1.08); }
      100% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0); transform: scale(1); }
    }

    /* Speaking Avatar Glow */
    .msg-avatar.speaking {
      animation: avatarGlow 1.2s infinite ease-in-out alternate;
    }
    @keyframes avatarGlow {
      from { transform: scale(1); box-shadow: 0 0 5px var(--primary); }
      to { transform: scale(1.15); box-shadow: 0 0 20px var(--accent); }
    }

    /* Listening badge */
    .listening-badge {
      position: absolute;
      top: -34px;
      left: 16px;
      background: rgba(244, 63, 94, 0.95);
      color: #fff;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 12px rgba(244, 63, 94, 0.35);
      animation: badgeSlide 0.25s ease forwards;
      pointer-events: none;
      z-index: 5;
    }
    @keyframes badgeSlide { from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:translateY(0); } }
    .listening-badge .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #fff;
      animation: pulseDot 1s infinite;
    }
    @keyframes pulseDot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.3; transform: scale(0.7); } }

    /* Forms & Inputs */
    .input-field {
      width: 100%; padding: 12px 16px; background: rgba(0,0,0,0.2); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); font-family: inherit; font-size: 0.95rem; transition: all 0.2s;
    }
    .input-field:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-dim); }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; margin-bottom: 6px; font-size: 0.85rem; color: var(--muted); font-weight: 500; }

    /* Cards & Lists */
    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      padding: 20px; transition: all 0.3s; backdrop-filter: var(--glass-blur);
    }
    .card:hover { border-color: var(--border-light); transform: translateY(-2px); box-shadow: var(--shadow); }
    
    .list-grid { display: grid; gap: 16px; }

    /* Email View */
    .email-tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
    .email-tab { padding: 8px 16px; cursor: pointer; color: var(--muted); font-weight: 600; transition: 0.2s; border-radius: 6px; }
    .email-tab.active { background: var(--surface2); color: var(--text); }
    .email-tab:hover:not(.active) { color: var(--text); }

    .email-item { display: flex; flex-direction: column; gap: 8px; cursor: pointer; background: rgba(0,0,0,0.15); border: 1px solid transparent; }
    .email-item:hover { border-color: rgba(108,99,255,0.4); background: rgba(0,0,0,0.25); transform: translateX(4px); box-shadow: -4px 0 0 var(--primary); }
    .email-header { display: flex; justify-content: space-between; align-items: baseline; }
    .email-sender { font-weight: 700; color: var(--accent); font-size: 1.05rem; }
    .email-date { font-size: 0.75rem; color: var(--muted); font-weight: 500; }
    .email-subject { font-size: 0.95rem; font-weight: 600; color: var(--text); }
    .email-preview { font-size: 0.85rem; color: var(--muted2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.4; }

    /* Calendar View */
    .event-item { display: flex; gap: 16px; align-items: flex-start; }
    .event-time { flex-shrink: 0; width: 100px; text-align: right; }
    .event-time-start { font-weight: 600; color: var(--accent); font-size: 1.1rem; }
    .event-time-date { font-size: 0.75rem; color: var(--muted); }
    .event-details { flex: 1; background: rgba(0,0,0,0.15); padding: 12px 16px; border-radius: 8px; border-left: 3px solid var(--primary); }
    .event-title { font-weight: 600; font-size: 1rem; margin-bottom: 4px; }
    .event-loc { font-size: 0.8rem; color: var(--muted); display: flex; align-items: center; gap: 4px; }

    /* To-Do View */
    .todo-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .todo-list-select { background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 6px; font-family: inherit; font-size: 0.9rem; cursor: pointer; }
    .todo-item { display: flex; align-items: center; gap: 16px; padding: 14px; background: rgba(0,0,0,0.15); border: 1px solid var(--border); border-radius: 8px; transition: 0.2s; }
    .todo-item:hover { border-color: var(--border-light); }
    .todo-checkbox { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--primary); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
    .todo-checkbox.completed { background: var(--primary); }
    .todo-checkbox.completed::after { content: '✓'; color: #fff; font-size: 14px; }
    .todo-content { flex: 1; }
    .todo-title { font-size: 1rem; font-weight: 500; transition: 0.2s; }
    .todo-title.completed { text-decoration: line-through; color: var(--muted); }
    .todo-meta { font-size: 0.75rem; color: var(--muted); margin-top: 4px; }
    .todo-actions { display: flex; gap: 8px; opacity: 0.5; transition: 0.2s; }
    .todo-item:hover .todo-actions { opacity: 1; }

    /* Chat View (Existing logic, adapted style) */
    .chat-area { flex: 1; overflow-y: auto; padding: 24px 30px; display: flex; flex-direction: column; gap: 24px; }
    .message { display: flex; gap: 16px; animation: msgIn 0.3s ease; }
    @keyframes msgIn { from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:translateY(0);} }
    .message.user { flex-direction: row-reverse; }
    .msg-avatar { width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
    .message.assistant .msg-avatar { background: linear-gradient(135deg,var(--primary),var(--accent)); color:#fff; }
    .message.user .msg-avatar { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
    .msg-bubble { max-width: 75%; padding: 16px 20px; border-radius: 16px; font-size: 0.95rem; line-height: 1.6; letter-spacing: 0.2px; }
    .message.assistant .msg-bubble { background: var(--surface); border: 1px solid var(--border); border-top-left-radius: 4px; backdrop-filter: var(--glass-blur); }
    .message.user .msg-bubble { background: linear-gradient(135deg, var(--primary), #857dff); color: #fff; border-top-right-radius: 4px; box-shadow: 0 4px 15px var(--primary-dim); }
    
    .input-bar { padding: 20px 30px; border-top: 1px solid var(--border); background: rgba(16,19,26,0.6); backdrop-filter: var(--glass-blur); }
    .input-wrap { display: flex; gap: 12px; align-items: flex-end; background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: 16px; padding: 12px 16px; transition: all 0.2s; position: relative; }
    .input-wrap:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-dim); background: rgba(0,0,0,0.4); }
    #messageInput { flex: 1; background: none; border: none; outline: none; color: var(--text); font-family: inherit; font-size: 0.95rem; resize: none; max-height: 150px; min-height: 24px; line-height: 1.5; }
    .send-btn { width: 40px; height: 40px; border-radius: 12px; background: var(--primary); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; color: #fff; flex-shrink: 0; box-shadow: 0 4px 10px var(--primary-dim); }
    .send-btn:hover { background: #857dff; transform: translateY(-2px) scale(1.05); }

    /* Modals */
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); z-index: 100; display: none; align-items: center; justify-content: center; padding: 20px; opacity: 0; transition: opacity 0.3s; }
    .modal-overlay.active { display: flex; opacity: 1; }
    .modal { background: var(--surface2); border: 1px solid var(--border-light); border-radius: 16px; width: 100%; max-width: 600px; max-height: 90vh; display: flex; flex-direction: column; box-shadow: 0 20px 50px rgba(0,0,0,0.5); transform: translateY(20px); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    .modal-overlay.active .modal { transform: translateY(0); }
    .modal-header { padding: 20px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .modal-title { font-size: 1.2rem; font-weight: 600; }
    .modal-close { background: none; border: none; color: var(--muted); font-size: 1.5rem; cursor: pointer; transition: 0.2s; line-height: 1; }
    .modal-close:hover { color: var(--text); }
    .modal-body { padding: 24px; overflow-y: auto; }
    .modal-footer { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 12px; }

    /* Toast */
    #toast { position: fixed; bottom: 30px; right: 30px; background: var(--surface2); border: 1px solid var(--primary); border-radius: 12px; padding: 14px 20px; font-size: 0.9rem; font-weight: 500; color: #fff; box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 15px var(--primary-dim); transform: translateY(20px); opacity: 0; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); pointer-events: none; z-index: 200; }
    #toast.show { transform: translateY(0); opacity: 1; }

    .empty-state { text-align: center; padding: 40px 20px; color: var(--muted); }
    .empty-icon { font-size: 3rem; margin-bottom: 16px; opacity: 0.5; }
    
    .loading-spinner { border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--primary); border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; margin: 0 auto; }
    @keyframes spin { to { transform: rotate(360deg); } }

  </style>
</head>
<body>
<div class="app">

  <!-- ── SIDEBAR ── -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo-icon">J</div>
      <div>
        <div class="logo-text">Jarvis</div>
        <div class="logo-sub">AI Copilot</div>
      </div>
    </div>

    <div style="padding: 0 12px 10px;">
      <button class="btn btn-primary" style="width: 100%; justify-content: center; gap: 8px; border-radius: 10px; font-weight: 600; padding: 10px;" onclick="newConversation()">
        <span>➕</span> New Chat
      </button>
    </div>

    <nav class="nav-menu">
      <button class="nav-item active" onclick="switchView('chat')"><span>💬</span> Chat Assistant</button>
      <button class="nav-item" onclick="switchView('email')"><span>📧</span> Mailbox</button>
      <button class="nav-item" onclick="switchView('calendar')"><span>📅</span> Calendar</button>
      <button class="nav-item" onclick="switchView('todo')"><span>✅</span> To-Do</button>
    </nav>

    <div class="conv-section" id="convSection">
      <p class="sidebar-label">Recent Chats</p>
      <div class="conv-list" id="convList"></div>
    </div>

    <div class="sidebar-footer">
      <div class="user-info">
        <div class="avatar" id="userAvatar">?</div>
        <div class="user-details">
          <div class="user-name" id="userName">Loading...</div>
          <div class="user-email" id="userEmail"></div>
        </div>
        <button class="logout-btn" onclick="logout()" title="Sign out">Sign out</button>
      </div>
    </div>
  </aside>

  <!-- ── MAIN AREA ── -->
  <main class="main">
    
    <!-- TOPBAR -->
    <div class="topbar">
      <div>
        <div class="topbar-title" id="viewTitle">Chat Assistant</div>
        <div class="topbar-sub" id="viewSub">Jarvis AI Powered</div>
      </div>
      <div class="topbar-actions" id="topbarActions">
        <button class="btn btn-outline" style="padding: 6px 12px; font-size: 0.8rem;" onclick="newConversation()" id="newChatBtn">New Chat</button>
      </div>
    </div>

    <!-- CHAT VIEW -->
    <div id="view-chat" class="view-container active">
      <div class="chat-area" id="chatArea">
        <div class="empty-state" id="welcomeScreen" style="margin-top: 10vh;">
          <div class="empty-icon">🤖</div>
          <h2 style="font-size: 1.8rem; font-weight: 700; color: var(--text); margin-bottom: 12px;">How can I help you today?</h2>
          <p style="max-width: 500px; margin: 0 auto; line-height: 1.6;">I can manage your Microsoft 365 emails, schedule events, and organize your tasks.</p>
        </div>
      </div>
      <div class="input-bar">
        <div class="input-wrap">
          <textarea id="messageInput" placeholder="Ask Jarvis anything..." rows="1" onkeydown="handleKey(event)"></textarea>
          <button class="mic-btn" id="micBtn" title="Voice input">🎤</button>
          <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
        </div>
      </div>
    </div>

    <!-- EMAIL VIEW -->
    <div id="view-email" class="view-container">
      <div class="content-area">
        <div class="email-tabs">
          <div class="email-tab active" onclick="loadEmails()">Inbox</div>
          <!-- Drafts feature UI simplified, but could add tab here -->
        </div>
        <div id="emailList" class="list-grid">
          <!-- Emails injected here -->
        </div>
      </div>
    </div>

    <!-- CALENDAR VIEW -->
    <div id="view-calendar" class="view-container">
      <div class="content-area">
        <div style="display:flex; justify-content: space-between; margin-bottom: 24px; align-items:center;">
          <h3 style="font-weight: 600;">Upcoming Events</h3>
        </div>
        <div id="calendarList" class="list-grid">
          <!-- Events injected here -->
        </div>

<div id="toast"></div>

<script>
  let currentConvId = null;
  let isLoading = false;
  let currentView = 'chat';

  // ── Voice Assistant System (STT & TTS) ──
  let recognizer = null;
  let isListening = false;
  let userStoppedManually = false;
  let preferredVoice = null;

  function loadVoices() {
    if (!('speechSynthesis' in window)) return;
    const voices = window.speechSynthesis.getVoices();
    if (!voices || voices.length === 0) return;

    // Prefer Natural / Google / Enhanced English voices
    preferredVoice = voices.find(v => v.lang.startsWith('en') && (v.name.includes('Google') || v.name.includes('Natural') || v.name.includes('Enhanced') || v.name.includes('Samantha') || v.name.includes('Zira')))
      || voices.find(v => v.lang.startsWith('en'))
      || voices[0];
  }

  if ('speechSynthesis' in window) {
    loadVoices();
    if (window.speechSynthesis.onvoiceschanged !== undefined) {
      window.speechSynthesis.onvoiceschanged = loadVoices;
    }
  }

  function initSpeechRecognition() {
    const micBtn = document.getElementById('micBtn');
    if (!micBtn) return;

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      console.warn('Speech recognition not supported in this browser.');
      micBtn.title = 'Speech recognition not supported in this browser';
      return;
    }

    recognizer = new SpeechRecognition();
    recognizer.continuous = false;
    recognizer.interimResults = true;
    recognizer.lang = 'en-US';

    recognizer.onstart = () => {
      isListening = true;
      userStoppedManually = false;
      micBtn.classList.add('listening');
      micBtn.setAttribute('title', 'Listening... Click to stop');
      showListeningBadge(true);
    };

    recognizer.onresult = (e) => {
      let interim = '';
      let final = '';

      for (let i = e.resultIndex; i < e.results.length; ++i) {
        if (e.results[i].isFinal) {
          final += e.results[i][0].transcript;
        } else {
          interim += e.results[i][0].transcript;
        }
      }

      const input = document.getElementById('messageInput');
      if (input) {
        if (final) {
          input.value = final;
        } else if (interim) {
          input.value = interim;
        }
      }

      if (final) {
        stopListening();
        sendMessage();
      }
    };

    recognizer.onerror = (e) => {
      console.error('Speech recognition error:', e.error);
      isListening = false;
      micBtn.classList.remove('listening');
      micBtn.setAttribute('title', 'Voice input');
      showListeningBadge(false);

      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        showToast('⚠️ Microphone permission denied. Please allow microphone access.');
      } else if (e.error === 'no-speech') {
        if (!userStoppedManually) {
          showToast('No speech detected. Please try again.');
        }
      } else if (e.error !== 'aborted') {
        showToast(`Speech error: ${e.error}`);
      }
    };

    recognizer.onend = () => {
      isListening = false;
      micBtn.classList.remove('listening');
      micBtn.setAttribute('title', 'Voice input');
      showListeningBadge(false);
    };

    micBtn.addEventListener('click', toggleListening);
  }

  function toggleListening() {
    if (!recognizer) {
      showToast('Voice recognition is not supported in this browser. Please use Chrome or Edge.');
      return;
    }

    if (isListening) {
      userStoppedManually = true;
      stopListening();
    } else {
      try {
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        recognizer.start();
      } catch (e) {
        console.error('Recognizer start error', e);
      }
    }
  }

  function stopListening() {
    if (recognizer && isListening) {
      try {
        recognizer.stop();
      } catch (e) {}
    }
    isListening = false;
    const micBtn = document.getElementById('micBtn');
    if (micBtn) {
      micBtn.classList.remove('listening');
      micBtn.setAttribute('title', 'Voice input');
    }
    showListeningBadge(false);
  }

  function showListeningBadge(show) {
    let badge = document.getElementById('listeningBadge');
    const inputWrap = document.querySelector('.input-wrap');
    if (!inputWrap) return;

    if (show) {
      if (!badge) {
        badge = document.createElement('div');
        badge.id = 'listeningBadge';
        badge.className = 'listening-badge';
        badge.innerHTML = '<span class="dot"></span> Listening...';
        inputWrap.appendChild(badge);
      }
    } else {
      if (badge) badge.remove();
    }
  }

  // Strip code, HTML tags, markdown, and technical jargon before TTS
  function cleanTextForSpeech(rawText) {
    if (!rawText) return '';
    let text = rawText;

    // Remove code blocks
    text = text.replace(/```[\s\S]*?```/g, ' Code snippet omitted. ');
    // Remove inline code
    text = text.replace(/`([^`]+)`/g, '$1');
    // Remove HTML tags completely
    text = text.replace(/<[^>]*>/g, ' ');
    // Convert HTML entities
    text = text.replace(/&amp;/g, '&')
               .replace(/&lt;/g, '<')
               .replace(/&gt;/g, '>')
               .replace(/&quot;/g, '"')
               .replace(/&#39;/g, "'");
    // Remove markdown headers, links, formatting
    text = text.replace(/^#+\s+/gm, '')
               .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')
               .replace(/[*_]{1,3}([^*_]+)[*_]{1,3}/g, '$1')
               .replace(/^[\s*-+>]+\s+/gm, '');
    // Remove excess whitespace
    return text.replace(/\s+/g, ' ').trim();
  }

  function speak(text, avatarEl = null) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();

    const cleanText = cleanTextForSpeech(text);
    if (!cleanText) return;

    const utter = new SpeechSynthesisUtterance(cleanText);
    if (preferredVoice) {
      utter.voice = preferredVoice;
    }
    utter.lang = 'en-US';
    utter.rate = 0.98;
    utter.pitch = 1.0;

    if (avatarEl) {
      avatarEl.classList.add('speaking');
      utter.onend = () => avatarEl.classList.remove('speaking');
      utter.onerror = () => avatarEl.classList.remove('speaking');
    }

    window.speechSynthesis.speak(utter);
  }

  async function init() {
    await loadUser();
    await loadConversations();
    initSpeechRecognition();
  }

  async function loadUser() {
    try {
      const r = await fetch('/auth/me');
      if (r.status === 401) { window.location.href = '/login.html'; return; }
      const d = await r.json();
      if (!d.authenticated) { window.location.href = '/login.html'; return; }
      const u = d.user;
      document.getElementById('userName').textContent = u.name || 'User';
      document.getElementById('userEmail').textContent = u.email || '';
      document.getElementById('userAvatar').textContent = (u.name || u.email || '?')[0].toUpperCase();
    } catch(e) { window.location.href = '/login.html'; }
  }

  // ── UI Navigation ──
  function switchView(view) {
    currentView = view;
    document.querySelectorAll('.nav-item').forEach(el => {
      if (el.getAttribute('onclick') && el.getAttribute('onclick').includes(`'${view}'`)) {
        el.classList.add('active');
      } else {
        el.classList.remove('active');
      }
    });
    
    document.querySelectorAll('.view-container').forEach(el => el.classList.remove('active'));
    const targetView = document.getElementById('view-' + view);
    if (targetView) targetView.classList.add('active');

    const titles = { chat: 'Chat Assistant', email: 'Mailbox', calendar: 'Calendar', todo: 'To-Do Tasks' };
    const viewTitle = document.getElementById('viewTitle');
    if (viewTitle) viewTitle.textContent = titles[view] || 'Chat Assistant';
    
    const convSection = document.getElementById('convSection');
    if (convSection) convSection.style.display = view === 'chat' ? 'flex' : 'none';
    
    const actions = document.getElementById('topbarActions');
    if (actions) {
      actions.innerHTML = '';
      if (view === 'chat') {
        actions.innerHTML = '<button class="btn btn-outline" style="padding:6px 12px;font-size:0.8rem;" onclick="newConversation()">+ New Chat</button>';
      } else if (view === 'email') {
        actions.innerHTML = '<button class="btn btn-primary" style="padding:6px 12px;font-size:0.8rem;" onclick="openDraftModal()">+ New Draft</button>';
        loadEmails();
      } else if (view === 'calendar') {
        actions.innerHTML = '<button class="btn btn-primary" style="padding:6px 12px;font-size:0.8rem;" onclick="openEventModal()">+ Add Event</button>';
        loadEvents();
      } else if (view === 'todo') {
        loadTodoLists();
      }
    }
  }

  // ── Emails ──
  async function loadEmails() {
    const list = document.getElementById('emailList');
    list.innerHTML = '<div class="loading-spinner"></div>';
    try {
      const r = await fetch('/api/emails?top=15');
      if(!r.ok) throw new Error();
      const data = await r.json();
      list.innerHTML = '';
      if(data.value.length === 0) list.innerHTML = '<div class="empty-state">No emails found</div>';
      data.value.forEach(msg => {
        const div = document.createElement('div');
        div.className = 'card email-item';
        const date = new Date(msg.receivedDateTime).toLocaleDateString(undefined, {month:'short', day:'numeric'});
        div.innerHTML = `
          <div class="email-header">
            <div class="email-sender">${escHtml(msg.from?.emailAddress?.name || msg.from?.emailAddress?.address || 'Unknown')}</div>
            <div class="email-date">${date}</div>
          </div>
          <div class="email-subject">${escHtml(msg.subject || '(No Subject)')}</div>
          <div class="email-snippet">${escHtml(msg.bodyPreview || '')}</div>
        `;
        div.onclick = () => openEmailModal(msg);
        list.appendChild(div);
      });
    } catch(e) {
      list.innerHTML = '<div class="empty-state">Failed to load emails</div>';
    }
  }

  function openEmailModal(msg) {
    document.getElementById('emailModalBody').innerHTML = `
      <div style="margin-bottom: 12px; font-weight:600;">From: ${escHtml(msg.from?.emailAddress?.name || '')} &lt;${escHtml(msg.from?.emailAddress?.address || '')}&gt;</div>
      <div style="margin-bottom: 12px; font-weight:600;">Subject: ${escHtml(msg.subject || '')}</div>
      <hr style="border:none; border-top:1px solid var(--border); margin: 12px 0;"/>
      <div style="white-space: pre-wrap;">${escHtml(msg.body?.content || msg.bodyPreview || '')}</div>
    `;
    document.getElementById('emailModalFooter').innerHTML = `
      <button class="btn btn-outline" onclick="closeModal('emailModal')">Close</button>
      <button class="btn btn-primary" onclick="closeModal('emailModal'); openDraftReply('${msg.id}', '${escHtml(msg.from?.emailAddress?.address || '')}', 'Re: ${escHtml(msg.subject || '')}')">Reply</button>
      <button class="btn btn-primary" style="background:var(--accent);" onclick="closeModal('emailModal'); summarizeEmail('${msg.id}')">Summarize with AI</button>
    `;
    document.getElementById('emailModal').classList.add('active');
  }

  function openDraftModal() {
    document.getElementById('draftModalTitle').textContent = 'Compose Draft';
    document.getElementById('draftTo').value = '';
    document.getElementById('draftSubject').value = '';
    document.getElementById('draftBody').value = '';
    document.getElementById('draftReplyId').value = '';
    document.getElementById('draftSubjectGroup').style.display = 'block';
    document.getElementById('draftModal').classList.add('active');
  }

  function openDraftReply(replyId, to, subject) {
    document.getElementById('draftModalTitle').textContent = 'Reply to Email';
    document.getElementById('draftTo').value = to;
    document.getElementById('draftSubject').value = subject;
    document.getElementById('draftBody').value = '';
    document.getElementById('draftReplyId').value = replyId;
    document.getElementById('draftSubjectGroup').style.display = 'none';
    document.getElementById('draftModal').classList.add('active');
  }

  async function submitDraft() {
    const replyId = document.getElementById('draftReplyId').value;
    const to = document.getElementById('draftTo').value.split(',').map(s=>s.trim()).filter(Boolean);
    const subject = document.getElementById('draftSubject').value;
    const body = document.getElementById('draftBody').value;

    try {
      let r;
      if (replyId) {
        r = await fetch(`/api/emails/${replyId}/reply-draft`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ comment: body })
        });
      } else {
        r = await fetch('/api/emails/draft', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ to_recipients: to, subject, body_content: body })
        });
      }
      if(r.ok) {
        closeModal('draftModal');
        showToast('Draft created successfully!');
      } else { showToast('Failed to create draft'); }
    } catch(e) { showToast('Error creating draft'); }
  }

  function summarizeEmail(id) {
    switchView('chat');
    document.getElementById('messageInput').value = `Summarize the email with ID: ${id}`;
    sendMessage();
  }

  // ── Calendar ──
  async function loadEvents() {
    const list = document.getElementById('calendarList');
    list.innerHTML = '<div class="loading-spinner"></div>';
    try {
      const r = await fetch('/api/calendar/events');
      if(!r.ok) throw new Error();
      const data = await r.json();
      list.innerHTML = '';
      if(data.value.length === 0) list.innerHTML = '<div class="empty-state">No upcoming events</div>';
      data.value.forEach(evt => {
        const div = document.createElement('div');
        div.className = 'card';
        const start = new Date(evt.start.dateTime).toLocaleString([], {dateStyle:'short', timeStyle:'short'});
        const end = new Date(evt.end.dateTime).toLocaleString([], {timeStyle:'short'});
        div.innerHTML = `
          <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
            <div style="font-weight:700; font-size:1.05rem; color:var(--text);">${escHtml(evt.subject)}</div>
            <div style="font-size:0.8rem; color:var(--accent); font-weight:600;">${start} - ${end}</div>
          </div>
          <div style="font-size:0.85rem; color:var(--muted);">${escHtml(evt.location?.displayName || 'No location')}</div>
        `;
        list.appendChild(div);
      });
    } catch(e) { list.innerHTML = '<div class="empty-state">Failed to load events</div>'; }
  }

  function openEventModal() {
    document.getElementById('eventSubject').value = '';
    document.getElementById('eventStart').value = '';
    document.getElementById('eventEnd').value = '';
    document.getElementById('eventLocation').value = '';
    document.getElementById('eventAttendees').value = '';
    document.getElementById('eventBody').value = '';
    document.getElementById('eventModal').classList.add('active');
  }

  async function submitEvent() {
    const subject = document.getElementById('eventSubject').value;
    const start = document.getElementById('eventStart').value;
    const end = document.getElementById('eventEnd').value;
    const location = document.getElementById('eventLocation').value;
    const attendees = document.getElementById('eventAttendees').value.split(',').map(s=>s.trim()).filter(Boolean);
    const body = document.getElementById('eventBody').value;

    if(!subject || !start || !end) { showToast('Please fill required fields'); return; }

    try {
      const r = await fetch('/api/calendar/events', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          subject,
          start: { dateTime: start, timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone },
          end: { dateTime: end, timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone },
          location: { displayName: location },
          attendees: attendees.map(e => ({ emailAddress: { address: e } })),
          body: { content: body, contentType: 'text' }
        })
      });
      if(r.ok) {
        closeModal('eventModal');
        loadEvents();
        showToast('Event created!');
      } else { showToast('Failed to create event'); }
    } catch(e) { showToast('Error'); }
  }

  // ── To-Do Tasks ──
  async function loadTodoLists() {
    try {
      const r = await fetch('/api/todo-lists');
      if(!r.ok) return;
      const data = await r.json();
      const select = document.getElementById('todoListSelect');
      select.innerHTML = '';
      data.value.forEach(l => {
        const opt = document.createElement('option');
        opt.value = l.id; opt.textContent = l.displayName;
        select.appendChild(opt);
      });
      if(data.value.length > 0) loadTodos();
    } catch(e) {}
  }

  async function loadTodos() {
    const listId = document.getElementById('todoListSelect').value;
    if(!listId) return;
    const list = document.getElementById('todoList');
    list.innerHTML = '<div class="loading-spinner"></div>';
    try {
      const r = await fetch(`/api/todos?list_id=${listId}`);
      if(!r.ok) throw new Error();
      const data = await r.json();
      list.innerHTML = '';
      if(data.value.length === 0) list.innerHTML = '<div class="empty-state">No tasks in this list</div>';
      data.value.forEach(t => {
        const div = document.createElement('div');
        div.className = 'card';
        div.style.padding = '12px 16px';
        div.style.display = 'flex';
        div.style.alignItems = 'center';
        div.style.gap = '12px';
        const isDone = t.status === 'completed';
        div.innerHTML = `
          <input type="checkbox" ${isDone?'checked':''} onchange="toggleTodo('${t.id}', '${t.status}')" style="width:18px;height:18px;cursor:pointer;accent-color:var(--primary);"/>
          <span style="flex:1; font-size:0.95rem; ${isDone?'text-decoration:line-through;color:var(--muted);':''}">${escHtml(t.title)}</span>
          <button class="conv-action-btn delete" onclick="deleteTodo('${t.id}')">🗑️</button>
        `;
        list.appendChild(div);
      });
    } catch(e) { list.innerHTML = '<div class="empty-state">Failed to load tasks</div>'; }
  }

  async function createTodo() {
    const title = document.getElementById('newTodoTitle').value;
    const listId = document.getElementById('todoListSelect').value;
    if(!title || !listId) return;
    
    try {
      const r = await fetch('/api/todos', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ list_id: listId, title: title })
      });
      if(r.ok) {
        document.getElementById('newTodoTitle').value = '';
        loadTodos();
      } else { showToast('Failed to add task'); }
    } catch(e) { showToast('Error'); }
  }

  async function toggleTodo(id, currentStatus) {
    const listId = document.getElementById('todoListSelect').value;
    const newStatus = currentStatus === 'completed' ? 'notStarted' : 'completed';
    try {
      await fetch(`/api/todos/${id}?list_id=${listId}`, {
        method: 'PATCH',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ status: newStatus })
      });
      loadTodos();
    } catch(e) { showToast('Error updating task'); }
  }

  async function deleteTodo(id) {
    if(!confirm('Delete task?')) return;
    const listId = document.getElementById('todoListSelect').value;
    try {
      await fetch(`/api/todos/${id}?list_id=${listId}`, { method: 'DELETE' });
      loadTodos();
    } catch(e) { showToast('Error'); }
  }

  // ── Utils ──
  function closeModal(id) { document.getElementById(id).classList.remove('active'); }
  function showToast(msg) {
    const t = document.getElementById('toast');
    if (!t) return;
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  function escHtml(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  
  // ── Chat API ──
  async function loadConversations() {
    try {
      const r = await fetch('/api/conversations');
      if (!r.ok) return;
      const convs = await r.json();
      const list = document.getElementById('convList');
      if (!list) return;
      list.innerHTML = '';
      convs.forEach(c => {
        const item = document.createElement('div');
        item.className = 'conv-item' + (c.id === currentConvId ? ' active' : '');
        const safeTitle = escHtml(c.title || 'Conversation');
        item.innerHTML = `
          <div class="conv-title-wrap"><span>💬</span><span class="conv-title-text">${safeTitle}</span></div>
          <div class="conv-actions">
            <button class="conv-action-btn" title="Rename" onclick="event.stopPropagation(); renameConversation('${c.id}', '${safeTitle.replace(/'/g, "\\'")}')">✏️</button>
            <button class="conv-action-btn delete" title="Delete" onclick="event.stopPropagation(); deleteConversation('${c.id}')">🗑️</button>
          </div>
        `;
        item.onclick = () => loadConversation(c.id, c.title);
        list.appendChild(item);
      });
    } catch(e) {}
  }

  async function renameConversation(id, oldTitle) {
    const newTitle = prompt('Enter new title for conversation:', oldTitle);
    if (!newTitle || !newTitle.trim() || newTitle.trim() === oldTitle) return;
    try {
      const r = await fetch(`/api/conversations/${id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: newTitle.trim() })
      });
      if (r.ok) {
        if (currentConvId === id) document.getElementById('viewTitle').textContent = newTitle.trim();
        await loadConversations();
        showToast('Conversation renamed');
      }
    } catch(e) { showToast('Error renaming conversation'); }
  }

  async function deleteConversation(id) {
    if (!confirm('Delete this conversation?')) return;
    try {
      const r = await fetch(`/api/conversations/${id}`, { method: 'DELETE' });
      if (r.ok) {
        if (currentConvId === id) newConversation();
        await loadConversations();
        showToast('Conversation deleted');
      }
    } catch(e) { showToast('Error deleting conversation'); }
  }

  async function loadConversation(id, title) {
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    currentConvId = id;
    document.getElementById('viewTitle').textContent = title || 'Conversation';
    document.getElementById('chatArea').innerHTML = '';
    
    if(currentView !== 'chat') switchView('chat');

    try {
      const r = await fetch(`/api/conversations/${id}/messages`);
      const msgs = await r.json();
      msgs.forEach(m => appendMessage(m.role === 'user' ? 'user' : 'assistant', m.content, null, false, false));
    } catch(e) {}

    await loadConversations();
    scrollToBottom();
  }

  async function newConversation() {
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    currentConvId = null;
    const input = document.getElementById('messageInput');
    if (input) input.value = '';
    
    const chatArea = document.getElementById('chatArea');
    if (chatArea) {
      chatArea.innerHTML = `
        <div class="empty-state" id="welcomeScreen" style="margin-top: 10vh;">
          <div class="empty-icon">🤖</div>
          <h2 style="font-size: 1.8rem; font-weight: 700; color: var(--text); margin-bottom: 12px;">How can I help you today?</h2>
          <p style="max-width: 500px; margin: 0 auto; line-height: 1.6;">I can manage your Microsoft 365 emails, schedule events, and organize your tasks.</p>
        </div>`;
    }
    
    document.querySelectorAll('.conv-item').forEach(i => i.classList.remove('active'));
    const viewTitle = document.getElementById('viewTitle');
    if (viewTitle) viewTitle.textContent = 'New Chat';
    
    if (currentView !== 'chat') switchView('chat');
    await loadConversations();
    if (input) input.focus();
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  }

  async function sendMessage() {
    const input = document.getElementById('messageInput');
    const text = input.value.trim();
    if (!text || isLoading) return;

    const welcome = document.getElementById('welcomeScreen');
    if(welcome) welcome.remove();

    input.value = ''; 
    isLoading = true;
    document.getElementById('sendBtn').disabled = true;

    appendMessage('user', text);
    const typingId = 'typing_' + Date.now();
    appendMessage('assistant', '<div class="loading-spinner" style="width:16px;height:16px;border-width:2px;"></div>', typingId);

    try {
      const body = { message: text };
      if (currentConvId) body.conversation_id = currentConvId;

      const r = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });

      const el = document.getElementById(typingId);
      if(el) el.remove();

      if (!r.ok) {
        if (r.status === 401) { window.location.href = '/login.html'; return; }
        appendMessage('assistant', `⚠️ Error occurred.`);
        return;
      }

      const data = await r.json();
      if (!currentConvId) {
        currentConvId = data.conversation_id;
        document.getElementById('viewTitle').textContent = text.slice(0, 30) + '...';
        await loadConversations();
      }
      appendMessage('assistant', data.reply, null, true, true);
    } catch(e) {
      document.getElementById(typingId)?.remove();
      appendMessage('assistant', '⚠️ Network error.');
    } finally {
      isLoading = false;
      document.getElementById('sendBtn').disabled = false;
    }
  }

  function appendMessage(role, content, id=null, speakIt=false, animateTyping=false) {
    const area = document.getElementById('chatArea');
    const div = document.createElement('div');
    if(id) div.id = id;
    div.className = `message ${role}`;

    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar';
    avatar.textContent = role === 'assistant' ? 'J' : '👤';

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';

    div.appendChild(avatar);
    div.appendChild(bubble);

    if (role === 'user') {
      bubble.innerHTML = escHtml(content).replace(/\n/g, '<br>');
      area.appendChild(div);
      scrollToBottom();
    } else if (content.includes('loading-spinner')) {
      bubble.innerHTML = content;
      area.appendChild(div);
      scrollToBottom();
    } else {
      area.appendChild(div);
      const formattedHtml = formatMsg(content);

      if (animateTyping) {
        bubble.innerHTML = '';
        let i = 0;
        const speed = 12;
        const timer = setInterval(() => {
          i += 4;
          if (i >= formattedHtml.length) {
            bubble.innerHTML = formattedHtml;
            clearInterval(timer);
            scrollToBottom();
          } else {
            bubble.innerHTML = formattedHtml.slice(0, i);
            scrollToBottom();
          }
        }, speed);
      } else {
        bubble.innerHTML = formattedHtml;
        scrollToBottom();
      }

      if (speakIt) {
        speak(content, avatar);
      }
    }
  }
  
  function formatMsg(text) {
    return escHtml(text)
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(/`([^`]+)`/g, '<code style="background:rgba(255,255,255,0.1);padding:2px 6px;border-radius:4px;">$1</code>')
      .replace(/\n/g, '<br/>');
  }

  function scrollToBottom() {
    const area = document.getElementById('chatArea');
    area.scrollTop = area.scrollHeight;
  }
  
  async function logout() { window.location.href = '/auth/logout'; }

  init();
</script>
</body>
</html>
